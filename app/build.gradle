plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.floatingapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.floatingapp"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    sourceSets {
        main {
            manifest.srcFile 'app/src/main/AndroidManifest.xml'
            java.srcDirs = ['app/src/main/java']
        }
    }
}
